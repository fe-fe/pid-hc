<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="jakarta.faces.facelets">
    <article class="card material-history__material overflow-hidden" aria-labelledby="historyMaterial-#{material.codigo}">
        <header class="card-header material-history__material-header p-3 p-sm-4">
            <div class="d-flex flex-column flex-md-row align-items-md-start justify-content-between gap-3">
                <div class="d-flex flex-wrap align-items-center gap-2">
                    <h3 class="material-history__material-title mb-0" id="historyMaterial-#{material.codigo}">#{material.nome}</h3>
                    <span class="material-history__code badge rounded-pill d-inline-flex align-items-center gap-1">
                        <i class="bi bi-hash" aria-hidden="true"></i> #{material.codigo}
                    </span>
                </div>
                <button class="btn material-history__button material-history__button--primary align-self-start flex-shrink-0" type="button"
                    data-bs-toggle="modal" data-bs-target="#historyMaterialModal" data-mode="history"
                    data-code="#{material.codigo}" data-name="#{material.nome}" data-location="#{material.local}"
                    aria-label="Adicionar novo histórico para #{material.nome}">
                    <i class="bi bi-plus-lg" aria-hidden="true"></i> Novo histórico
                </button>
            </div>
            <div class="material-history__metadata d-flex flex-wrap align-items-center gap-2 gap-sm-3 mt-3">
                <span class="d-inline-flex align-items-center gap-1">
                    <i class="bi bi-geo-alt" aria-hidden="true"></i>
                    <span><strong>Local:</strong> #{material.local}</span>
                </span>
                <span class="material-history__count d-inline-flex align-items-center gap-2">
                    <i class="bi bi-calendar3" aria-hidden="true"></i> 2 marcas analisadas
                </span>
            </div>
        </header>
        <div class="card-body p-3 p-sm-4">
            <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-1 mb-3">
                <h4 class="material-history__section-title mb-0">Histórico de marcas</h4>
                <span class="material-history__order">Da análise mais recente para a mais antiga</span>
            </div>
            <ui:include src="/WEB-INF/components/tabelas/historicoMateriais.xhtml" />
        </div>
    </article>
</ui:composition>
