<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="jakarta.faces.facelets">
    <ui:decorate template="/WEB-INF/components/filtros/painel.xhtml">
        <ui:param name="filtroId" value="materiaisFilters" />
        <ui:param name="filtroDescricao" value="Refine os materiais exibidos" />
        <ui:define name="campos">
            <div>
                <label class="form-label" for="materiaisFilterCodigo">Código</label>
                <input class="form-control" type="text" id="materiaisFilterCodigo" name="codigo" />
            </div>
            <div>
                <label class="form-label" for="materiaisFilterNome">Nome</label>
                <input class="form-control" type="text" id="materiaisFilterNome" name="nome" />
            </div>
            <div>
                <label class="form-label" for="materiaisFilterStatus">Status</label>
                <select class="form-select" id="materiaisFilterStatus" name="status">
                    <option value="">Todos os status</option>
                    <option value="ativo">Ativo</option>
                    <option value="inativo">Inativo</option>
                </select>
            </div>
        </ui:define>
    </ui:decorate>
</ui:composition>
