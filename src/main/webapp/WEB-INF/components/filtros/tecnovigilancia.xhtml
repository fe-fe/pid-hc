<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:pt="jakarta.faces.passthrough"
    xmlns:ui="jakarta.faces.facelets">
    <ui:decorate template="/WEB-INF/components/filtros/painel.xhtml">
        <ui:param name="filtroId" value="tecnovigilanciaFilters" />
        <ui:param name="filtroDescricao" value="Refine os registros de tecnovigilância" />
        <ui:define name="formulario">
            <h:form id="formFiltrosTecnovigilancia" styleClass="d-flex flex-column gap-2 flex-grow-1">
                <fieldset>
                    <div class="row g-2">
                        <div class="col-6">
                            <h:outputLabel styleClass="form-label small mb-1" for="dataInicial" value="De" />
                            <h:inputText styleClass="form-control" pt:type="date" id="dataInicial"
                                value="#{desvioBean.dataInicial}">
                                <f:convertDateTime type="localDate" pattern="yyyy-MM-dd" />
                            </h:inputText>
                        </div>
                        <div class="col-6">
                            <h:outputLabel styleClass="form-label small mb-1" for="dataFinal" value="Até" />
                            <h:inputText styleClass="form-control" pt:type="date" id="dataFinal"
                                value="#{desvioBean.dataFinal}">
                                <f:convertDateTime type="localDate" pattern="yyyy-MM-dd" />
                            </h:inputText>
                        </div>
                    </div>
                    <h:message for="dataInicial" styleClass="text-danger small" />
                    <h:message for="dataFinal" styleClass="text-danger small" />
                </fieldset>
                <div class="filters-panel__actions d-flex justify-content-end gap-2 mt-auto">
                    <h:commandButton value="Limpar" styleClass="btn btn-outline-secondary"
                        action="#{desvioBean.limparFiltros}">
                        <f:ajax execute="@this" render="@form :formTabelaTecnovigilancia" resetValues="true" />
                    </h:commandButton>
                    <h:commandButton value="Aplicar filtros" styleClass="btn btn-primary"
                        action="#{desvioBean.aplicarFiltros}">
                        <f:ajax execute="@form" render="@form :formTabelaTecnovigilancia" />
                    </h:commandButton>
                </div>
            </h:form>
        </ui:define>
        <ui:define name="acoes" />
    </ui:decorate>
</ui:composition>
