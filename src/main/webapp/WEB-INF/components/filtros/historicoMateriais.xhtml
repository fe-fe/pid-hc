<ui:composition xmlns="http://www.w3.org/1999/xhtml"

        <ui:param name="filtroDescricao" value="Refine os materiais exibidos" />

            <div>
                <label class="form-label" for="historyManufacturerFilter">Fabricante</label>
                <select class="form-select" id="historyManufacturerFilter" name="fabricante">
                    <option value="">Todos os fabricantes</option>
                    <option>BD</option>
                    <option>BioSupply</option>
                    <option>Descarpack</option>
                    <option>Hospitalar Brasil</option>
                    <option>Medix Brasil</option>
                </select>
            </div>
            <div>

                    <option value="">Todos os status</option>
                    <option>Aprovado</option>
                    <option>Reprovado</option>
                </select>
            </div>
        </ui:define>
    </ui:decorate>
