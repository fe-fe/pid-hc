<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="jakarta.faces.facelets">
    <ui:decorate template="/WEB-INF/components/filtros/painel.xhtml">
        <ui:param name="filtroId" value="fabricantesFilters" />
        <ui:param name="filtroDescricao" value="Refine os fabricantes exibidos" />
        <ui:define name="campos">
            <div>
                <label class="form-label" for="fabricantesFilterNome">Nome</label>
                <input class="form-control" type="text" id="fabricantesFilterNome" name="nome" />
            </div>
            <div>
                <label class="form-label" for="fabricantesFilterStatus">Status</label>
                <select class="form-select" id="fabricantesFilterStatus" name="status">
                    <option value="">Todos os status</option>
                    <option value="ativo">Ativo</option>
                    <option value="inativo">Inativo</option>
                </select>
            </div>
        </ui:define>
    </ui:decorate>
</ui:composition>
