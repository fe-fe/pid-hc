<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:pt="jakarta.faces.passthrough"
    xmlns:ui="jakarta.faces.facelets">
            <footer class="pid-table__footer d-flex flex-wrap align-items-center justify-content-between gap-2 m-0 px-3 py-2 border-top">
                <small class="text-body-secondary">
                    <ui:fragment rendered="#{bean.variasPaginas}">
                        #{bean.primeiroRegistro}–#{bean.ultimoRegistro} de
                    </ui:fragment>
                    #{bean.totalRegistros}
                    #{bean.totalRegistros == 1 ? registroSingular : registroPlural}
                </small>

                <nav aria-label="Paginação de #{tabelaDescricao}" class="pid-table__pagination">
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item #{bean.paginaAtual == 0 ? 'disabled' : ''}">
                            <h:commandLink styleClass="page-link" action="#{bean.paginaAnterior}"
                                disabled="#{bean.paginaAtual == 0}" title="Página anterior">
                                <i class="bi bi-chevron-left" aria-hidden="true"></i>
                                <span class="visually-hidden">Página anterior</span>
                                <f:ajax render="@form" />
                            </h:commandLink>
                        </li>
                        <ui:repeat value="#{bean.paginas}" var="pagina">
                            <ui:fragment rendered="#{empty pagina}">
                                <li class="page-item disabled"><span class="page-link">…</span></li>
                            </ui:fragment>
                            <ui:fragment rendered="#{not empty pagina}">
                                <li class="page-item #{pagina == bean.paginaAtual ? 'active' : ''}">
                                    <h:commandLink styleClass="page-link" action="#{bean.irParaPagina(pagina)}"
                                        pt:aria-current="#{pagina == bean.paginaAtual ? 'page' : null}">
                                        #{pagina + 1}
                                        <f:ajax render="@form" />
                                    </h:commandLink>
                                </li>
                            </ui:fragment>
                        </ui:repeat>
                        <li class="page-item #{bean.ultimaPagina ? 'disabled' : ''}">
                            <h:commandLink styleClass="page-link" action="#{bean.proximaPagina}"
                                disabled="#{bean.ultimaPagina}" title="Próxima página">
                                <i class="bi bi-chevron-right" aria-hidden="true"></i>
                                <span class="visually-hidden">Próxima página</span>
                                <f:ajax render="@form" />
                            </h:commandLink>
                        </li>
                    </ul>
                </nav>
            </footer>
</ui:composition>
