<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets">

    <section class="pid-table card border shadow-sm overflow-hidden" aria-labelledby="tecnovigilancia-table-title">
        <h2 id="tecnovigilancia-table-title" class="visually-hidden">Tabela de tecnovigilância</h2>

        <h:form id="formTabelaTecnovigilancia">
            <div class="pid-table__responsive table-responsive">
                <table class="pid-table__table table table-hover align-middle mb-0">
                    <caption class="visually-hidden">
                        Desvios de qualidade com número VigiHosp, data, produto, marca, fabricante, motivo, desfecho e grau de dano.
                    </caption>
                    <thead class="pid-table__head">
                        <tr>
                            <th scope="col">VigiHosp</th>
                            <th scope="col">Data</th>
                            <th scope="col">Código</th>
                            <th scope="col">Produto</th>
                            <th scope="col">Marca</th>
                            <th scope="col">Fabricante</th>
                            <th scope="col">Motivo</th>
                            <th scope="col">Desfecho</th>
                            <th scope="col">Grau de dano</th>
                        </tr>
                    </thead>
                    <tbody>
                        <ui:repeat value="#{bean.desvios}" var="desvio">
                            <tr>
                                <td class="fw-semibold text-body text-nowrap">
                                    <h:outputText value="#{empty desvio.vigihosp ? '—' : desvio.vigihosp}" />
                                </td>
                                <td class="text-nowrap">
                                    <h:outputText value="#{desvio.data}">
                                        <f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
                                    </h:outputText>
                                </td>
                                <td class="text-nowrap">
                                    <h:outputText value="#{desvio.material.codigo}" />
                                </td>
                                <td>
                                    <h:outputText value="#{desvio.material.nome}" />
                                </td>
                                <td>
                                    <h:outputText value="#{empty desvio.marca ? '—' : desvio.marca.nome}" />
                                </td>
                                <td>
                                    <h:outputText value="#{desvio.fabricante.nome}" />
                                </td>
                                <td class="pid-table__description">
                                    <h:outputText value="#{desvio.motivo}" />
                                </td>
                                <td>
                                    <h:outputText value="#{empty desvio.desfecho ? '—' : desvio.desfecho.rotulo}" />
                                </td>
                                <td class="text-nowrap">
                                    <h:outputText value="#{empty desvio.grauDano ? '—' : desvio.grauDano.rotulo}" />
                                </td>
                            </tr>
                        </ui:repeat>

                        <ui:fragment rendered="#{empty bean.desvios}">
                            <tr>
                                <td class="text-center text-body-secondary py-5" colspan="9">
                                    Nenhum registro de tecnovigilância encontrado.
                                </td>
                            </tr>
                        </ui:fragment>
                    </tbody>
                </table>
            </div>

            <ui:include src="/WEB-INF/components/tabelas/paginacao.xhtml">
                <ui:param name="registroSingular" value="registro encontrado" />
                <ui:param name="registroPlural" value="registros encontrados" />
                <ui:param name="tabelaDescricao" value="tecnovigilância" />
            </ui:include>
        </h:form>
    </section>
</ui:composition>
