<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      lang="pt-BR">
<h:head>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>#{erroBean.titulo} - PID</title>
    <h:outputStylesheet library="css" name="global.css"/>
    <h:outputStylesheet library="css" name="pages/auth/login.css"/>
    <h:outputStylesheet library="webjars" name="bootstrap/5.3.8/css/bootstrap.min-jsf.css"/>
</h:head>
<h:body>
    <main class="auth-form">
        <div class="auth-card">
            <ui:fragment rendered="#{erroBean.acessoNegado}">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m14.5 9.5-5 5"/><path d="m9.5 9.5 5 5"/></svg>
            </ui:fragment>
            <ui:fragment rendered="#{erroBean.naoEncontrada}">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v3"/><path d="M11 14h.01"/></svg>
            </ui:fragment>
            <ui:fragment rendered="#{not erroBean.acessoNegado and not erroBean.naoEncontrada}">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
            </ui:fragment>
            <h1>#{erroBean.titulo}</h1>
            <p>#{erroBean.mensagem}</p>

            <h:outputLink value="#{request.contextPath}/" styleClass="btn btn-primary my-4">Voltar ao início</h:outputLink>
        </div>
    </main>
</h:body>
</html>
