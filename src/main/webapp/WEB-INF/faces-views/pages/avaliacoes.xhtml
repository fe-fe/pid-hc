<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:pt="jakarta.faces.passthrough"
    xmlns:ui="jakarta.faces.facelets"
    template="/WEB-INF/templates/pagina.xhtml">

    <ui:define name="title">
        Avaliações - PID
    </ui:define>


    <ui:define name="pageTitle">Avaliações</ui:define>

    <ui:define name="pageActions">
        <ui:include src="/WEB-INF/components/pesquisa.xhtml">
            <ui:param name="formId" value="formPesquisaAvaliacoes" />
            <ui:param name="bean" value="#{avaliacaoBean}" />
            <ui:param name="metodo" value="pesquisarPorCodigo" />
            <ui:param name="valor" value="#{avaliacaoBean.codigoPesquisa}" />
            <ui:param name="render" value=":formTabelaAvaliacoes" />
            <ui:param name="placeholder" value="Pesquisar material por código" />
            <ui:param name="rotulo" value="Código do material" />
        </ui:include>
        <h:form id="formNova" styleClass="page__action-buttons ms-auto">
            <ui:include src="/WEB-INF/components/filtros/botao.xhtml">
                <ui:param name="filtroId" value="avaliacoesFilters" />
            </ui:include>
            <h:commandLink styleClass="page__button page__button--primary" action="#{avaliacaoBean.novo}">
                <f:ajax execute="@this" render=":modalAvaliacaoConteudo" resetValues="true" />
                Criar Avaliação
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M8 12h8" />
                    <path d="M12 8v8" />
                </svg>
            </h:commandLink>
        </h:form>
    </ui:define>

    <ui:define name="pageContent">
        <ui:include src="/WEB-INF/components/tabelas/avaliacoes.xhtml">
            <ui:param name="bean" value="#{avaliacaoBean}" />
        </ui:include>
    </ui:define>

    <ui:define name="pageOverlays">
        <ui:include src="/WEB-INF/components/modais/avaliacao.xhtml" />

        <ui:include src="/WEB-INF/components/filtros/avaliacoes.xhtml" />
    </ui:define>

</ui:composition>
