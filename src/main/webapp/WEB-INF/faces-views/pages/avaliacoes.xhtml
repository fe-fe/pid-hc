<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:pt="jakarta.faces.passthrough"
    xmlns:ui="jakarta.faces.facelets"
    template="/WEB-INF/templates/pagina.xhtml">

    <ui:define name="title">
        Avaliações - PID
    </ui:define>


    <ui:define name="pageTitle">Avaliações</ui:define>

    <ui:define name="pageActions">
        <div class="page__search-area">
            <label class="page__search">
                <span class="visually-hidden">Pesquisa livre</span>
                <svg class="page__search-icon" width="16" height="16" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.3-4.3" />
                </svg>
                <input class="page__search-input" type="search" name="materialSearch"
                    placeholder="Pesquisar por código ou nome" autocomplete="off" />
            </label>
        </div>

        <div class="page__action-buttons">
            <ui:include src="/WEB-INF/components/filtros/botao.xhtml">
                <ui:param name="filtroId" value="avaliacoesFilters" />
            </ui:include>
            <button class="page__button page__button--primary" type="button" data-bs-toggle="modal"
                data-bs-target="#modalAvaliacao">
                Criar Avaliação
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M8 12h8" />
                    <path d="M12 8v8" />
                </svg>
            </button>
        </div>
    </ui:define>

    <ui:define name="pageContent">
        <ui:include src="/WEB-INF/components/tabelas/avaliacoes.xhtml">
            <ui:param name="bean" value="#{avaliacaoBean}" />
        </ui:include>
    </ui:define>

    <ui:define name="pageOverlays">
        <ui:include src="/WEB-INF/components/modais/avaliacoes/modalCriarAvaliacoes.xhtml" />

        <ui:include src="/WEB-INF/components/filtros/avaliacoes.xhtml" />
    </ui:define>

</ui:composition>
