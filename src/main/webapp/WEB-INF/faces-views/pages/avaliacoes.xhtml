<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:pt="jakarta.faces.passthrough"
    xmlns:ui="jakarta.faces.facelets"
    template="/WEB-INF/templates/pagina.xhtml">

    <ui:define name="title">
        Avaliações - PID
    </ui:define>


    <ui:define name="pageTitle">Avaliações</ui:define>

    <ui:define name="pageActions">
        <h:form id="formPesquisaAvaliacoes" styleClass="page__search input-group input-group-sm">
            <h:outputLabel for="codigo" value="Código do material" styleClass="visually-hidden" />
            <h:inputText id="codigo" value="#{avaliacaoBean.codigoPesquisa}"
                         styleClass="page__search-input form-control"
                         pt:type="search" pt:placeholder="Pesquisar material por código" />
            <h:commandButton value="Consultar" action="#{avaliacaoBean.pesquisarPorCodigo}"
                             styleClass="btn btn-primary">
                <f:ajax execute="@form" render=":formTabelaAvaliacoes" />
            </h:commandButton>
        </h:form>
        <div class="page__action-buttons ms-auto">
            <ui:include src="/WEB-INF/components/filtros/botao.xhtml">
                <ui:param name="filtroId" value="avaliacoesFilters" />
            </ui:include>
            <button class="page__button page__button--primary" type="button" data-bs-toggle="modal"
                data-bs-target="#modalAvaliacao">
                Criar Avaliação
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M8 12h8" />
                    <path d="M12 8v8" />
                </svg>
            </button>
        </div>
    </ui:define>

    <ui:define name="pageContent">
        <ui:include src="/WEB-INF/components/tabelas/avaliacoes.xhtml">
            <ui:param name="bean" value="#{avaliacaoBean}" />
        </ui:include>
    </ui:define>

    <ui:define name="pageOverlays">
        <ui:include src="/WEB-INF/components/modais/avaliacoes/modalCriarAvaliacoes.xhtml" />

        <ui:include src="/WEB-INF/components/filtros/avaliacoes.xhtml" />
    </ui:define>

</ui:composition>
