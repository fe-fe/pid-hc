<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    template="/WEB-INF/templates/pagina.xhtml">

    <ui:param name="pageClass" value="material-history" />

    <!-- Dados ilustrativos para a apresentação visual, sem vínculo com persistência. -->
    <ui:param name="materiaisHistorico" value="#{[
        {'codigo': 'MAT-001', 'nome': 'Cateter intravenoso periférico 20G', 'local': 'Laboratório de avaliação',
         'historicos': [
            {'marca': 'Insyte Autoguard', 'fabricante': 'BD', 'data': '26/09/2026', 'dataIso': '2026-09-26', 'aprovado': true,
             'parecer': 'Boa estabilidade durante a punção e dispositivo de segurança adequado.'},
            {'marca': 'Safe Cath', 'fabricante': 'Descarpack', 'data': '11/08/2026', 'dataIso': '2026-08-11', 'aprovado': false,
             'parecer': 'O dispositivo apresentou resistência acima do esperado na progressão.'}
         ]},
        {'codigo': 'MAT-003', 'nome': 'Equipo para infusão macrogotas', 'local': 'Centro Cirúrgico',
         'historicos': [
            {'marca': 'FluxCare', 'fabricante': 'Hospitalar Brasil', 'data': '18/09/2026', 'dataIso': '2026-09-18', 'aprovado': true,
             'parecer': 'Amostra conforme os requisitos técnicos.'},
            {'marca': 'MedFlow', 'fabricante': 'Medix Brasil', 'data': '22/07/2026', 'dataIso': '2026-07-22', 'aprovado': true,
             'parecer': 'Fluxo regular e conexões compatíveis com os equipamentos avaliados.'}
         ]},
        {'codigo': 'MAT-004', 'nome': 'Luva de procedimento sem pó', 'local': 'Pronto Atendimento',
         'historicos': [
            {'marca': 'ProtecPlus', 'fabricante': 'BioSupply', 'data': '15/09/2026', 'dataIso': '2026-09-15', 'aprovado': false,
             'parecer': 'Resistência abaixo do especificado no lote avaliado.'},
            {'marca': 'Supermax Premium', 'fabricante': 'Medix Brasil', 'data': '29/08/2026', 'dataIso': '2026-08-29', 'aprovado': true,
             'parecer': 'Material íntegro, com bom ajuste e resistência durante o uso simulado.'}
         ]}
    ]}" />

    <ui:define name="title">Histórico de materiais - PID</ui:define>

    <ui:define name="head">
        <h:outputStylesheet library="css" name="pages/historico-materiais.css" />
    </ui:define>

    <ui:define name="pageTitle">Histórico de materiais</ui:define>

    <ui:define name="pageSubtitle">
        <span class="page__subtitle">Consulte as marcas já analisadas</span>
    </ui:define>

    <ui:define name="pageActions">
        <div class="page__search input-group input-group-sm">
            <span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
            <label class="visually-hidden" for="historySearch">Pesquisa livre</label>
            <input id="historySearch" class="page__search-input form-control" type="search" autocomplete="off"
                placeholder="Pesquisar material, marca ou fabricante" />
        </div>
        <div class="page__action-buttons">
            <ui:include src="/WEB-INF/components/filtros/botao.xhtml">
                <ui:param name="filtroId" value="historyFilters" />
            </ui:include>
            <button class="page__button page__button--primary" type="button"
                data-bs-toggle="modal" data-bs-target="#historyMaterialModal" data-mode="material">
                <i class="bi bi-plus-lg" aria-hidden="true"></i> Novo avaliação
            </button>
        </div>
    </ui:define>

    <ui:define name="pageContent">
        <section class="material-history__list d-flex flex-column gap-3" aria-labelledby="historyListTitle">
            <h2 id="historyListTitle" class="visually-hidden">Histórico de análises por material</h2>
            <ui:repeat value="#{materiaisHistorico}" var="material">
                <ui:include src="/WEB-INF/components/cardHistoricoMaterial.xhtml" />
            </ui:repeat>
            <footer class="material-history__footer d-flex flex-wrap justify-content-between gap-2">
                <span>3 materiais</span>
                <span>6 históricos exibidos</span>
            </footer>
        </section>
    </ui:define>

    <ui:define name="pageOverlays">
        <ui:include src="/WEB-INF/components/filtros/historicoMateriais.xhtml" />

        <ui:include src="/WEB-INF/components/modais/historicoMateriais/modalCriarHistoricoMateriais.xhtml" />
        <ui:include src="/WEB-INF/components/modais/historicoMateriais/modalEditarHistoricoMateriais.xhtml" />
        <ui:include src="/WEB-INF/components/modais/historicoMateriais/modalExcluirHistoricoMateriais.xhtml" />
    </ui:define>

    <ui:define name="scripts">
        <h:outputScript library="js" name="pages/historico-materiais.js" target="body" />
    </ui:define>
</ui:composition>
