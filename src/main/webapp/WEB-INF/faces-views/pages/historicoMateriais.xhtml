<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    template="/WEB-INF/templates/layout.xhtml">

    <ui:param name="contentClass" value="layout__content--material-history" />

    <!-- Dados ilustrativos para a apresentação visual, sem vínculo com persistência. -->
    <ui:param name="materiaisHistorico" value="#{[
        {'codigo': 'MAT-001', 'nome': 'Cateter intravenoso periférico 20G', 'local': 'Laboratório de avaliação',
         'historicos': [
            {'marca': 'Insyte Autoguard', 'fabricante': 'BD', 'data': '26/09/2026', 'dataIso': '2026-09-26', 'aprovado': true,
             'parecer': 'Boa estabilidade durante a punção e dispositivo de segurança adequado.'},
            {'marca': 'Safe Cath', 'fabricante': 'Descarpack', 'data': '11/08/2026', 'dataIso': '2026-08-11', 'aprovado': false,
             'parecer': 'O dispositivo apresentou resistência acima do esperado na progressão.'}
         ]},
        {'codigo': 'MAT-003', 'nome': 'Equipo para infusão macrogotas', 'local': 'Centro Cirúrgico',
         'historicos': [
            {'marca': 'FluxCare', 'fabricante': 'Hospitalar Brasil', 'data': '18/09/2026', 'dataIso': '2026-09-18', 'aprovado': true,
             'parecer': 'Amostra conforme os requisitos técnicos.'},
            {'marca': 'MedFlow', 'fabricante': 'Medix Brasil', 'data': '22/07/2026', 'dataIso': '2026-07-22', 'aprovado': true,
             'parecer': 'Fluxo regular e conexões compatíveis com os equipamentos avaliados.'}
         ]},
        {'codigo': 'MAT-004', 'nome': 'Luva de procedimento sem pó', 'local': 'Pronto Atendimento',
         'historicos': [
            {'marca': 'ProtecPlus', 'fabricante': 'BioSupply', 'data': '15/09/2026', 'dataIso': '2026-09-15', 'aprovado': false,
             'parecer': 'Resistência abaixo do especificado no lote avaliado.'},
            {'marca': 'Supermax Premium', 'fabricante': 'Medix Brasil', 'data': '29/08/2026', 'dataIso': '2026-08-29', 'aprovado': true,
             'parecer': 'Material íntegro, com bom ajuste e resistência durante o uso simulado.'}
         ]}
    ]}" />

    <ui:define name="title">Histórico de materiais - PID</ui:define>

    <ui:define name="head">
        <h:outputStylesheet library="css" name="pages/historico-materiais.css" />
    </ui:define>

    <ui:define name="content">
        <div class="material-history">
            <header class="material-history__header d-flex flex-column flex-md-row align-items-md-center gap-1 gap-md-3 px-3 px-sm-4 py-3">
                <h1 class="mb-0">Histórico de materiais</h1>
                <span class="material-history__subtitle">Consulte as marcas já analisadas</span>
            </header>

            <section class="material-history__toolbar d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3 px-3 px-sm-4 py-3"
                aria-label="Pesquisa e ações de materiais">
                <div class="material-history__search input-group input-group-sm">
                    <span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
                    <label class="visually-hidden" for="historySearch">Pesquisa livre</label>
                    <input id="historySearch" class="form-control" type="search" autocomplete="off"
                        placeholder="Pesquisar material, marca ou fabricante" />
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <ui:include src="/WEB-INF/components/filtros/botao.xhtml">
                        <ui:param name="filtroId" value="historyFilters" />
                        <ui:param name="filtroBotaoClasse" value="btn material-history__button material-history__button--secondary" />
                    </ui:include>
                    <button class="btn material-history__button material-history__button--primary" type="button"
                        data-bs-toggle="modal" data-bs-target="#historyMaterialModal" data-mode="material">
                        <i class="bi bi-plus-lg" aria-hidden="true"></i> Novo avaliação
                    </button>
                </div>
            </section>

            <section class="material-history__list d-flex flex-column gap-3 p-3 p-sm-4" aria-labelledby="historyListTitle">
                <h2 id="historyListTitle" class="visually-hidden">Histórico de análises por material</h2>
                <ui:repeat value="#{materiaisHistorico}" var="material">
                    <ui:include src="/WEB-INF/components/cardHistoricoMaterial.xhtml" />
                </ui:repeat>
                <footer class="material-history__footer d-flex flex-wrap justify-content-between gap-2">
                    <span>3 materiais</span>
                    <span>6 históricos exibidos</span>
                </footer>
            </section>

            <ui:include src="/WEB-INF/components/filtros/historicoMateriais.xhtml" />

            <!-- Uma modal visual compartilhada pelos modos criar material, adicionar e editar histórico. -->
            <div class="modal fade material-history__modal" id="historyMaterialModal" tabindex="-1"
                aria-labelledby="historyMaterialModalTitle" aria-hidden="true">
                <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
                    <div class="modal-content">
                        <div class="modal-header align-items-start">
                            <div>
                                <h2 class="modal-title fs-5" id="historyMaterialModalTitle">Novo avaliação</h2>
                                <p class="material-history__subtitle mt-1" id="historyMaterialModalDescription">Cadastre uma avaliação</p>
                            </div>
                            <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Fechar cadastro"></button>
                        </div>
                        <div class="modal-body">
                            <form id="historyMaterialForm" class="row g-3">
                                <div class="col-12 col-sm-6">
                                    <label class="form-label" for="historyMaterialCode">Código <span class="material-history__required">*</span></label>
                                    <input class="form-control" id="historyMaterialCode" name="codigo" placeholder="Ex.: MAT-005" />
                                </div>
                                <div class="col-12 col-sm-6">
                                    <label class="form-label" for="historyAnalysisDate">Data <span class="material-history__required">*</span></label>
                                    <input class="form-control" id="historyAnalysisDate" name="data" type="date" />
                                </div>
                                <div class="col-12">
                                    <label class="form-label" for="historyMaterialName">Nome <span class="material-history__required">*</span></label>
                                    <input class="form-control" id="historyMaterialName" name="nome" placeholder="Nome do material" />
                                </div>
                                <div class="col-12 col-sm-6">
                                    <label class="form-label" for="historyManufacturer">Fabricante <span class="material-history__required">*</span></label>
                                    <input class="form-control" id="historyManufacturer" name="fabricante" placeholder="Nome do fabricante" />
                                </div>
                                <div class="col-12 col-sm-6">
                                    <label class="form-label" for="historyBrand">Marca <span class="material-history__required">*</span></label>
                                    <input class="form-control" id="historyBrand" name="marca" placeholder="Marca analisada" />
                                </div>
                                <div class="col-12 col-sm-6">
                                    <label class="form-label" for="historyLocation">Local <span class="material-history__required">*</span></label>
                                    <input class="form-control" id="historyLocation" name="local" placeholder="Local da avaliação" />
                                </div>
                                <div class="col-12 col-sm-6">
                                    <label class="form-label" for="historyStatus">Status <span class="material-history__required">*</span></label>
                                    <select class="form-select" id="historyStatus" name="status">
                                        <option value="aprovado">Aprovado</option>
                                        <option value="reprovado">Reprovado</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label" for="historyOpinion">Parecer <span class="material-history__required">*</span></label>
                                    <textarea class="form-control" id="historyOpinion" name="parecer" rows="4" placeholder="Descreva o parecer da análise"></textarea>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button class="btn material-history__button material-history__button--secondary" type="button" data-bs-dismiss="modal">Cancelar</button>
                            <button class="btn material-history__button material-history__button--primary" id="historyMaterialModalAction"
                                type="button" data-bs-dismiss="modal">Criar material</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal fade material-history__modal" id="historyDeleteModal" tabindex="-1"
                aria-labelledby="historyDeleteModalTitle" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h2 class="modal-title fs-5" id="historyDeleteModalTitle">Excluir histórico</h2>
                            <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Fechar confirmação de exclusão"></button>
                        </div>
                        <div class="modal-body">
                            <span class="material-history__delete-icon d-inline-flex align-items-center justify-content-center mb-3">
                                <i class="bi bi-trash3" aria-hidden="true"></i>
                            </span>
                            <p>Deseja excluir o histórico da marca <strong id="historyDeleteBrand"></strong>?</p>
                            <p class="material-history__subtitle mt-2" id="historyDeleteMaterial"></p>
                        </div>
                        <div class="modal-footer">
                            <button class="btn material-history__button material-history__button--secondary" type="button" data-bs-dismiss="modal">Cancelar</button>
                            <button class="btn btn-danger material-history__button" type="button" data-bs-dismiss="modal">Excluir histórico</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>

    <ui:define name="scripts">
        <h:outputScript library="js" name="pages/historico-materiais.js" target="body" />
    </ui:define>
</ui:composition>
