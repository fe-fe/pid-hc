<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets"
    xmlns:p="jakarta.faces.passthrough" xmlns:f="jakarta.faces.core" template="/WEB-INF/templates/pagina.xhtml">

    <ui:param name="pageClass" value="material-history" />

    <ui:define name="title">Histórico de materiais - PID</ui:define>

    <ui:define name="head">
        <h:outputStylesheet library="css" name="pages/historico-materiais.css" />
    </ui:define>

    <ui:define name="pageTitle">Histórico de materiais</ui:define>

    <ui:define name="pageActions">

        <h:form id="formPesquisa" styleClass="page__search input-group input-group-sm">
            <h:inputText 
                id="codigo" 
                value="#{consultaMaterialBean.codigo}"
                styleClass="page__search-input form-control"
                p:placeholder="Pesquisar material por código"
                p:type="search" />

                <h:commandButton 
                    value="Consultar"
                    action="#{consultaMaterialBean.consultar}"
                    styleClass="btn btn-primary">
                    <f:ajax execute="@form" render=":resultado" />
                </h:commandButton>
        </h:form>

        <div class="page__action-buttons">
            <ui:include 
                src="/WEB-INF/components/filtros/botao.xhtml">
                <ui:param name="filtroId" value="historyFilters" />
            </ui:include>

            <button class="page__button page__button--primary" type="button" data-bs-toggle="modal"
                data-bs-target="#historyMaterialModal" data-mode="material">
                Nova avaliação <i class="bi bi-plus-lg" aria-hidden="true"></i>
            </button>
        </div>

    </ui:define>

    <ui:define name="pageContent">

        <section class="material-history">
            <h:panelGroup id="resultado" layout="block">
                <h:panelGroup 
                    layout="block" 
                    styleClass="card material-history__material overflow-hidden"
                    rendered="#{not empty consultaMaterialBean.material}">

                    <header class="card-header material-history__material-header p-3 p-sm-4">
                        <div class="d-flex justify-content-between flex-wrap align-items-center gap-2">
                            <h2 class="material-history__material-title mb-0 fs-1">
                                <h:outputText value="#{consultaMaterialBean.material.nome}" />
                            </h2>

                            <span
                                class="material-history__code fs-6 badge rounded-pill d-inline-flex align-items-center gap-1">
                                <i class="bi bi-hash" aria-hidden="true"></i>
                                Código:
                                <h:outputText value="#{consultaMaterialBean.material.codigo}" />
                            </span>
                        </div>
                    </header>

                    <div class="card-body p-3 p-sm-4">
                        <ui:repeat value="#{consultaMaterialBean.avaliacoesPorMarca.entrySet().toArray()}" var="grupo">

                            <section class="material-history__brand">

                                <h3 class="material-history__brand-title mb-3 mt-6 fs-5 fw-semibold">
                                    <span class="badge bg-primary">Marca: </span>#{grupo.key}
                                </h3>

                                <div class="pid-table pid-table__responsive table-responsive mb-3" tabindex="0"
                                    role="region" aria-label="Histórico de avaliações da marca #{grupo.key}">

                                    <h:dataTable value="#{grupo.value}" var="avaliacao"
                                        styleClass="pid-table__table pid-table__table--history table table-hover align-middle mb-0"
                                        headerClass="pid-table__head">

                                        <h:column headerClass="pid-table__head material-history__column-limited"
                                            styleClass="material-history__column-limited">
                                            <f:facet name="header">Data</f:facet>
                                            <h:outputText value="#{avaliacao.data}" />
                                        </h:column>

                                        <h:column headerClass="pid-table__head material-history__column-limited"
                                            styleClass="material-history__column-limited">
                                            <f:facet name="header">Resultado</f:facet>

                                            <h:outputText value="#{avaliacao.resultado}"
                                                styleClass="badge rounded-pill #{avaliacao.resultado eq 'APROVADO' ? 'bg-success' : 'bg-danger'}" />
                                        </h:column>

                                        <h:column>
                                            <f:facet name="header">Descrição</f:facet>
                                            <h:outputText value="#{avaliacao.descricao}" />
                                        </h:column>

                                        <h:column styleClass="material-history__table-opinion">
                                            <f:facet name="header">Parecer</f:facet>
                                            <h:outputText value="#{avaliacao.parecer}" />
                                        </h:column>

                                    </h:dataTable>

                                </div>

                            </section>

                        </ui:repeat>
                    </div>
                </h:panelGroup>

                <h:outputText value="Material não encontrado." rendered="#{empty consultaMaterialBean.material}" />
            </h:panelGroup>
        </section>

    </ui:define>

    <ui:define name="pageOverlays">
        <ui:include src="/WEB-INF/components/filtros/historicoMateriais.xhtml" />
        <ui:include src="/WEB-INF/components/modais/historicoMateriais/modalCriarHistoricoMateriais.xhtml" />
        <ui:include src="/WEB-INF/components/modais/historicoMateriais/modalEditarHistoricoMateriais.xhtml" />
        <ui:include src="/WEB-INF/components/modais/historicoMateriais/modalExcluirHistoricoMateriais.xhtml" />
    </ui:define>

    <ui:define name="scripts">
        <h:outputScript library="js" name="pages/historico-materiais.js" target="body" />
    </ui:define>
</ui:composition>
