<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:pt="jakarta.faces.passthrough"
                template="/WEB-INF/templates/pagina.xhtml">

    <ui:define name="title">Usuários - PID</ui:define>

    <ui:define name="pageTitle">Usuários cadastrados</ui:define>

    <ui:define name="pageActions">
        <ui:include src="/WEB-INF/components/pesquisa.xhtml">
            <ui:param name="formId" value="formPesquisaUsuarios" />
            <ui:param name="bean" value="#{usuarioBean}" />
            <ui:param name="metodo" value="pesquisarPorNome" />
            <ui:param name="valor" value="#{usuarioBean.nomePesquisa}" />
            <ui:param name="render" value=":formLista" />
            <ui:param name="placeholder" value="Pesquisar usuário por nome" />
            <ui:param name="rotulo" value="Nome do usuário" />
        </ui:include>
        <div class="page__action-buttons ms-auto">
            <ui:include src="/WEB-INF/components/filtros/botao.xhtml">
                <ui:param name="filtroId" value="usuariosFilters" />
            </ui:include>
            <h:form id="formNovo">
                <h:commandLink styleClass="page__button page__button--primary" action="#{usuarioBean.novo}">
                    <f:ajax execute="@this" render=":modalCadastroConteudo" resetValues="true" />
                    Novo usuário
                </h:commandLink>
            </h:form>
        </div>
    </ui:define>

    <ui:define name="pageContent">
        <ui:include src="/WEB-INF/components/tabelas/usuarios.xhtml">
            <ui:param name="bean" value="#{usuarioBean}" />
        </ui:include>
    </ui:define>

    <ui:define name="pageOverlays">
        <ui:include src="/WEB-INF/components/filtros/usuarios.xhtml" />
        <ui:include src="/WEB-INF/components/modais/usuario.xhtml" />
    </ui:define>
</ui:composition>
