<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="jakarta.faces.html"
        xmlns:ui="jakarta.faces.facelets"
        template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="title">
        Categorias - PID
    </ui:define>

    <ui:define name="content">
        <h:outputText value="#{sessao.usuarioLogado.perfil}"></h:outputText><br />
        <h3>Categorias Cadastradas</h3>
        <ui:repeat value="#{categoriaBean.categorias}" var="categoria" varStatus="status">
            <div id="categoria-#{status.index}">
                #{categoria.nome}
            </div>
        </ui:repeat>

        <h:panelGroup rendered="#{sessao.contemPerfil('ADMINISTRADOR', 'ANALISTA')}">
            <h3>Criar nova Categoria</h3>
            <h:form>
                <h:outputLabel for="nome" value="Nome" />
                <h:inputText styleClass="input" id="nome" value="#{categoriaBean.categoria.nome}"/>
                <h:commandButton value="Cadastrar"  styleClass="button" action="#{categoriaBean.cadastrar}"/>
            </h:form>
        </h:panelGroup>
    </ui:define>

</ui:composition>
