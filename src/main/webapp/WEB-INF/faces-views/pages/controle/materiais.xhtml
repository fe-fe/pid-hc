<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    template="/WEB-INF/templates/pagina.xhtml">

    <ui:define name="title">
        Materiais - PID
    </ui:define>


    <ui:define name="pageTitle">Materiais</ui:define>

    <ui:define name="pageActions">
        <p class="text-body-secondary small mb-0">Tabela de referência usada nas sugestões do cadastro de avaliação.</p>

        <div class="page__action-buttons">
            <ui:include src="/WEB-INF/components/filtros/botao.xhtml">
                <ui:param name="filtroId" value="materiaisFilters" />
            </ui:include>
            <button class="page__button page__button--primary" type="button" data-bs-toggle="modal"
                data-bs-target="#modalIncluirCadastro">
                Incluir Material
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M8 12h8" />
                    <path d="M12 8v8" />
                </svg>
            </button>
        </div>
    </ui:define>

    <ui:define name="pageContent">
        <ui:include src="/WEB-INF/components/cadastroReferencia.xhtml">
            <ui:param name="bean" value="#{materialBean}" />
            <ui:param name="titulo" value="Materiais" />
            <ui:param name="rotulo" value="material" />
            <ui:param name="comCodigo" value="#{true}" />
        </ui:include>
    </ui:define>

    <ui:define name="pageOverlays">
        <ui:include src="/WEB-INF/components/filtros/materiais.xhtml" />
    </ui:define>

</ui:composition>
