<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="title">
        Materiais - PID
    </ui:define>

    <ui:define name="head">
        <h:outputStylesheet library="css" name="pages/materiais.css" />
    </ui:define>

    <ui:define name="content">

        <header class="materials-page__header">
            <h1>Materiais</h1>
        </header>

        <section class="materials-page__actions">
            <p class="text-body-secondary small mb-0">Tabela de referência usada nas sugestões do cadastro de avaliação.</p>

            <div class="action__buttons">
                <button class="action__criar" type="button" data-bs-toggle="modal"
                    data-bs-target="#modalIncluirCadastro">
                    Incluir Material
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M8 12h8" />
                        <path d="M12 8v8" />
                    </svg>
                </button>
            </div>
        </section>

        <div class="p-4">
            <ui:include src="/WEB-INF/components/cadastroReferencia.xhtml">
                <ui:param name="bean" value="#{materialBean}" />
                <ui:param name="titulo" value="Materiais" />
                <ui:param name="rotulo" value="material" />
                <ui:param name="comCodigo" value="#{true}" />
            </ui:include>
        </div>
    </ui:define>

</ui:composition>
