<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:pt="jakarta.faces.passthrough"
    xmlns:ui="jakarta.faces.facelets"
    template="/WEB-INF/templates/pagina.xhtml">

    <ui:define name="title">
        Fabricantes - PID
    </ui:define>


    <ui:define name="pageTitle">Fabricantes</ui:define>

    <ui:define name="pageSubtitle">
        <p class="page__subtitle">Tabela de referência usada nas sugestões do cadastro de avaliação.</p>
    </ui:define>

    <ui:define name="pageActions">
        <ui:include src="/WEB-INF/components/pesquisa.xhtml">
            <ui:param name="formId" value="formPesquisaFabricantes" />
            <ui:param name="bean" value="#{fabricanteBean}" />
            <ui:param name="metodo" value="pesquisar" />
            <ui:param name="valor" value="#{fabricanteBean.termoPesquisa}" />
            <ui:param name="render" value=":formTabelaCadastro" />
            <ui:param name="placeholder" value="Pesquisar por nome" />
            <ui:param name="rotulo" value="Nome do fabricante" />
        </ui:include>
        <h:form id="formNovo" styleClass="page__action-buttons ms-auto">
            <h:commandLink styleClass="page__button page__button--primary" action="#{fabricanteBean.novo}">
                <f:ajax execute="@this" render=":modalCadastroConteudo" resetValues="true" />
                Incluir Fabricante
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M8 12h8" />
                    <path d="M12 8v8" />
                </svg>
            </h:commandLink>
        </h:form>
    </ui:define>

    <ui:define name="pageContent">
        <ui:include src="/WEB-INF/components/tabelas/cadastros.xhtml">
            <ui:param name="bean" value="#{fabricanteBean}" />
            <ui:param name="titulo" value="Fabricantes" />
            <ui:param name="rotulo" value="fabricante" />
            <ui:param name="comCodigo" value="#{false}" />
        </ui:include>
    </ui:define>

    <ui:define name="pageOverlays">
        <ui:include src="/WEB-INF/components/modais/cadastro.xhtml">
            <ui:param name="bean" value="#{fabricanteBean}" />
            <ui:param name="comCodigo" value="#{false}" />
        </ui:include>
    </ui:define>

</ui:composition>
